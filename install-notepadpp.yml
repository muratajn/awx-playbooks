---
- name: Install Notepad++
  hosts: all
  gather_facts: no
  tasks:
    - name: Check if already installed
      win_stat:
        path: C:\Program Files\Notepad++
otepad++.exe
      register: npp_installed

    - name: Copy installer to WorkSpace
      win_copy:
        src: files/npp.8.9.8.Installer.x64.exe
        dest: C:\temp
pp_installer.exe
      when: not npp_installed.stat.exists

    - name: Install Notepad++ silently
      win_package:
        path: C:\temp
pp_installer.exe
        arguments: /S
        state: present
      when: not npp_installed.stat.exists

    - name: Clean up installer
      win_file:
        path: C:\temp
pp_installer.exe
        state: absent
